<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" role="img"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Diagram vocabulary: stroke weights, node marks and box styles</title>
  <desc>A legend for the shared drawing vocabulary. Ocean strokes carry shared or
  baseline paths, ember strokes carry divergent or new-version paths, a filled dot
  marks a split or a reconvergence, a solid box is a real endpoint, a dashed box is
  a sandbox, and a neutral rounded box is a mediator. Every label is set in the
  neutral rather than in a brand colour, which is the recommended practice.</desc>

  <text x="28" y="24" font-size="13" fill="#6B7A8A">diagram vocabulary</text>

  <path d="M28 68 H148" stroke="#1C88A7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="176" y="72.5" font-size="12.5" fill="#6B7A8A">shared fragment / v0</text>
  <text x="392" y="72.5" font-size="12.5" fill="#6B7A8A">ocean #1C88A7, 4px</text>

  <path d="M28 104 H148" stroke="#D75A2E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="176" y="108.5" font-size="12.5" fill="#6B7A8A">divergent fragment / v1</text>
  <text x="392" y="108.5" font-size="12.5" fill="#6B7A8A">ember #D75A2E, 4px</text>

  <path d="M28 140 H148" stroke="#1C88A7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="140" r="6.5" fill="#D75A2E"/>
  <text x="176" y="144.5" font-size="12.5" fill="#6B7A8A">split point</text>
  <text x="392" y="144.5" font-size="12.5" fill="#6B7A8A">ember dot, r 6.5</text>

  <path d="M28 176 H148" stroke="#1C88A7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="176" r="6.5" fill="#1C88A7"/>
  <text x="176" y="180.5" font-size="12.5" fill="#6B7A8A">reconvergence</text>
  <text x="392" y="180.5" font-size="12.5" fill="#6B7A8A">ocean dot, r 6.5</text>

  <rect x="28" y="204" width="120" height="28" rx="6" stroke="#1C88A7" stroke-width="2" fill="none"/>
  <text x="176" y="222.5" font-size="12.5" fill="#6B7A8A">real endpoint</text>
  <text x="392" y="222.5" font-size="12.5" fill="#6B7A8A">solid, 2px, rx 6</text>

  <rect x="28" y="244" width="120" height="28" rx="6" stroke="#D75A2E" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <text x="176" y="262.5" font-size="12.5" fill="#6B7A8A">sandbox / withheld</text>
  <text x="392" y="262.5" font-size="12.5" fill="#6B7A8A">dashed 6 5</text>

  <rect x="28" y="284" width="120" height="28" rx="8" stroke="#6B7A8A" stroke-width="2" fill="none"/>
  <text x="176" y="302.5" font-size="12.5" fill="#6B7A8A">mediator / machinery</text>
  <text x="392" y="302.5" font-size="12.5" fill="#6B7A8A">neutral #6B7A8A, rx 8</text>
</svg>
