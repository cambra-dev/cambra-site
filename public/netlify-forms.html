<!DOCTYPE html>
<html>
  <head><title>Netlify Forms Detection</title></head>
  <body>
    <!-- This file exists solely so Netlify detects and registers the site's
         forms during the build scan. Keep each form's fields in sync with:
           contact          src/components/Contact.astro
           design-partner   src/pages/design-partners.astro
           job-application  src/pages/jobs.astro -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="radio" name="intent" value="following" />
      <input type="radio" name="intent" value="joining" />
    </form>

    <form name="design-partner" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="design-partner" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <textarea name="project"></textarea>
      <textarea name="stack"></textarea>
      <textarea name="pain"></textarea>
      <textarea name="agents"></textarea>
      <select name="timeline"></select>
    </form>

    <form name="job-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="job-application" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="location" />
      <select name="hours"></select>
      <input type="url" name="resume" />
      <select name="area"></select>
      <textarea name="experience"></textarea>
      <input type="url" name="work" />
      <input type="text" name="links" />
    </form>
  </body>
</html>
